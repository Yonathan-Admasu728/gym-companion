<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gym Companion</title>
<meta name="description" content="90-day recomposition gym companion: what's next, how to do it, what you lifted last time.">
<meta name="theme-color" content="#0e1013">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gym">
<meta name="format-detection" content="telephone=no">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.webmanifest">
<style>
:root{
  --bg:#0e1013; --surface:#161a1f; --surface-2:#1f242b; --line:#2b3139; --text:#eceef1; --muted:#a3abb5; --faint:#737c87;
  --accent:#5fd4b0; --accent-ink:#03241a; --accent-soft:rgba(95,212,176,.13); --accent-line:rgba(95,212,176,.5);
  --warn:#e9bd62; --warn-soft:rgba(233,189,98,.12); --danger:#f08080; --danger-soft:rgba(240,128,128,.12);
  --r:16px; --hdr:112px;
  color-scheme:dark;
}
:root[data-theme="light"]{
  --bg:#f3f4f6; --surface:#ffffff; --surface-2:#eceef2; --line:#d9dde3; --text:#15181c; --muted:#555e69; --faint:#848c96;
  --accent:#0b7f63; --accent-ink:#ffffff; --accent-soft:rgba(11,127,99,.10); --accent-line:rgba(11,127,99,.45);
  --warn:#8a5d00; --warn-soft:rgba(214,160,40,.16); --danger:#b93838; --danger-soft:rgba(185,56,56,.10);
  color-scheme:light;
}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--text);font:17px/1.4 -apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,"Helvetica Neue",Arial,sans-serif;
  padding-bottom:calc(108px + env(safe-area-inset-bottom));-webkit-font-smoothing:antialiased}
body.modal-open{overflow:hidden}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none;border:0;background:none;padding:0}
button:disabled{opacity:.35;cursor:default}
a{color:inherit;-webkit-tap-highlight-color:transparent}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto;padding:0 16px}
.muted{color:var(--muted)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- header ---------- */
.top{position:sticky;top:0;z-index:30;background:var(--bg);padding-top:env(safe-area-inset-top);border-bottom:1px solid var(--line)}
.bar1{display:flex;align-items:center;justify-content:space-between;gap:8px;min-height:48px}
.when{font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.when b{color:var(--text);font-weight:600}
.bar1-right{display:flex;align-items:center;gap:8px}
.pill{font-size:15px;font-weight:600;padding:4px 10px;border-radius:999px;background:var(--surface-2);font-variant-numeric:tabular-nums}
.timer{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums;min-width:48px;text-align:right}
.timer.editing{font-size:14px;font-weight:600;color:var(--warn)}
.icon-btn{width:44px;height:44px;border-radius:12px;display:grid;place-items:center;color:var(--muted)}
.icon-btn[aria-pressed="true"]{background:var(--accent-soft);color:var(--accent)}
.tabs{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;padding:2px 0 12px}
.tab{position:relative;min-height:54px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.15}
.tab b{font-size:17px;letter-spacing:.06em;font-weight:700}
.tab small{font-size:13px;color:var(--muted)}
.tab[aria-selected="true"]{background:var(--accent-soft);border-color:var(--accent-line);color:var(--accent)}
.tab[aria-selected="true"] small{color:var(--accent)}
.tab .live{position:absolute;top:8px;right:9px;width:8px;height:8px;border-radius:50%;background:var(--accent)}

.bar1-left{display:flex;align-items:center;gap:8px;min-width:0}
.mode{display:flex;gap:2px;padding:2px;border-radius:12px;background:var(--surface-2);flex-shrink:0}
.mode button{min-height:44px;min-width:52px;padding:0 8px;border-radius:9px;font-size:15px;font-weight:600;color:var(--muted)}
.mode button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--accent-line) inset}
.tab b.long{font-size:15px;letter-spacing:.05em}
.week{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;margin:0 0 10px}
.wk{display:flex;flex-direction:column;align-items:center;padding:5px 0;border-radius:8px;background:var(--surface);border:1px solid var(--line);line-height:1.15;min-width:0}
.wk b{font-size:12px;font-weight:700;color:var(--muted)}
.wk small{font-size:10.5px;color:var(--faint);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.wk.home small{color:var(--accent)}
.wk.today{border-color:var(--accent-line);background:var(--accent-soft)}
.wk.today b{color:var(--text)}
.circuit-note{margin:16px 0 0;padding:12px 14px;border-radius:12px;border:1px dashed var(--accent-line);font-size:15px;color:var(--muted)}
.circuit-note b{color:var(--text)}
.flow-moves{margin:0;padding:0;list-style:none;display:flex;flex-wrap:wrap;gap:6px}
.flow-moves li{font-size:14px;padding:6px 10px;border-radius:999px;background:var(--surface-2);color:var(--text)}
.rounds{display:flex;gap:6px}
.rounds .chip{width:auto;flex:1}
.steppers.one{grid-template-columns:1fr}
.hold-foot{grid-template-columns:1fr auto}
.hold-run{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:4px;padding:0 4px}
.hold-sub{font-size:13px;color:var(--muted)}
.hold-sub.in{color:var(--accent);font-weight:600}
.hold-stop{height:54px;min-width:104px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:18px;flex-shrink:0}
/* ---------- intro ---------- */
.intro{padding:16px 0 4px}
.intro-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
.intro h1{font-size:22px;line-height:1.2;margin:0;font-weight:700}
.intro .prog{font-size:17px;font-weight:600;color:var(--muted);white-space:nowrap;font-variant-numeric:tabular-nums}
.progbar{height:4px;border-radius:4px;background:var(--surface-2);margin:10px 0 12px;overflow:hidden}
.progbar i{display:block;height:100%;background:var(--accent);border-radius:4px}
.note{margin:0 0 8px;font-size:15px;color:var(--muted);border-left:3px solid var(--accent-line);padding:2px 0 2px 10px}
.warm{margin:0 0 6px;font-size:15px;color:var(--muted)}
.warm b{color:var(--text);font-weight:600}
.lastline{margin:0;font-size:14px;color:var(--faint)}
.banner{margin:14px 0 0;padding:12px 14px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px}
.banner.ok{border-color:var(--accent-line);background:var(--accent-soft)}
.banner .btns{display:flex;gap:6px;flex-shrink:0}

/* ---------- cards ---------- */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);margin-top:12px;scroll-margin-top:calc(var(--hdr) + 10px)}
.card.open{border-color:var(--accent-line)}
.card.done:not(.open){opacity:.72}
.card-head{width:100%;display:flex;align-items:center;gap:12px;text-align:left;padding:14px 14px;min-height:76px}
.num{flex:0 0 auto;min-width:34px;height:34px;padding:0 6px;border-radius:10px;background:var(--surface-2);display:grid;place-items:center;font-weight:700;font-size:16px;font-variant-numeric:tabular-nums}
.card.next .num{background:var(--accent);color:var(--accent-ink)}
.head-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.ex-name{font-size:19px;font-weight:600;line-height:1.25}
.ex-name .alt{font-weight:400;color:var(--faint);font-size:15px}
.ex-meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.target{font-size:16px;font-weight:600;color:var(--accent);font-variant-numeric:tabular-nums}
.next-pill{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--accent-ink);background:var(--accent);padding:2px 7px;border-radius:6px}
.ex-prev{font-size:15px;color:var(--muted);font-variant-numeric:tabular-nums}
.status{flex:0 0 auto;width:36px;height:36px;border-radius:50%;display:grid;place-items:center;border:2px solid var(--line);font-size:13px;font-weight:700;color:var(--muted);font-variant-numeric:tabular-nums}
.status.part{border-color:var(--accent-line);color:var(--accent)}
.status.full{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.card-body{padding:0 12px 14px;display:flex;flex-direction:column;gap:12px}

.seg{display:flex;gap:6px;padding:4px;border-radius:12px;background:var(--surface-2)}
.seg button{flex:1;min-height:44px;border-radius:9px;font-size:15px;font-weight:600;color:var(--muted);padding:6px 8px;line-height:1.2}
.seg button[aria-pressed="true"]{background:var(--surface);color:var(--text);box-shadow:0 0 0 1px var(--accent-line) inset}

.sec-label{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint);margin:0 0 6px}
.tech ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:6px}
.tech li{font-size:15.5px;line-height:1.38;color:var(--text)}
.tech li b{font-weight:600;color:var(--accent);margin-right:4px}
.demo{display:flex;align-items:center;gap:12px;min-height:56px;padding:10px 14px;border-radius:12px;background:var(--surface-2);text-decoration:none;border:1px solid var(--line)}
.demo .play{width:36px;height:36px;border-radius:50%;background:var(--text);color:var(--bg);display:grid;place-items:center;flex:0 0 auto}
.demo b{display:block;font-size:16px;font-weight:600}
.demo small{display:block;font-size:13.5px;color:var(--muted)}
.demo .ext{margin-left:auto;color:var(--faint)}

.pb{border-radius:12px;background:var(--surface-2);padding:12px 14px;display:grid;grid-template-columns:1fr 1fr;gap:10px 12px}
.pb-col{min-width:0}
.pb-k{font-size:12px;font-weight:700;letter-spacing:.09em;text-transform:uppercase;color:var(--faint)}
.pb-v{font-size:19px;font-weight:600;line-height:1.3;font-variant-numeric:tabular-nums;margin-top:2px;word-break:break-word}
.pb-v .muted{font-weight:400;font-size:16px}
.pb-w,.pb-r,.pb-m{display:block}
.pb-m{font-size:16px}
.pb-r{white-space:nowrap}
.pb-sub{font-size:13px;color:var(--muted);margin-top:2px;font-variant-numeric:tabular-nums}
.pb-full{grid-column:1/-1}
.pb-hint{grid-column:1/-1;font-size:14px;color:var(--warn)}
.early{grid-column:1/-1;margin:0;font-size:14px;color:var(--muted);border-top:1px solid var(--line);padding-top:8px}
.link-btn{color:var(--accent);font-size:15px;font-weight:600;min-height:44px;padding:0 2px;text-align:left}
.pb-copy{grid-column:1/-1;min-height:44px;border-radius:10px;border:1px solid var(--line);padding:0 12px;font-size:15px;font-weight:600;background:var(--surface)}
.tech-toggle{width:100%;display:flex;align-items:center;justify-content:space-between;min-height:44px}
.tech-toggle .sec-label{margin:0}
.tech-toggle .tt{font-size:14px;font-weight:600;color:var(--accent)}
.tech ul{margin-top:2px}
.set-up{width:100%;display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border-radius:12px;border:1px dashed var(--line);text-align:left;color:var(--muted);font-variant-numeric:tabular-nums}
.set-up .set-n{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;min-width:46px}
.set-up .set-sum{font-size:16px;flex:1}
.set-up .set-tgt{font-size:14px;color:var(--faint)}

/* sets */
.sets{display:flex;flex-direction:column;gap:8px}
.set{border:1px solid var(--line);border-radius:12px;padding:10px 8px}
.set.current{border-color:var(--accent-line)}
.set.is-done{background:var(--accent-soft)}
.set-title{display:flex;align-items:center;justify-content:space-between;font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 8px;min-height:20px}
.set-close{min-height:44px;margin:-12px -6px -12px 0;padding:0 12px;text-transform:none;letter-spacing:0;color:var(--accent)}
.set-title small{text-transform:none;letter-spacing:0;font-weight:500;color:var(--faint);font-size:13px}
.steppers{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stepper label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px 2px}
.stp{display:grid;grid-template-columns:44px 1fr 44px;height:54px;border-radius:12px;background:var(--surface-2);overflow:hidden}
.stp-btn{font-size:26px;font-weight:400;color:var(--text);display:grid;place-items:center}
.stp-btn:active{background:var(--line)}
.stp input{width:100%;min-width:0;border:0;background:transparent;text-align:center;font-size:24px;font-weight:600;font-variant-numeric:tabular-nums;padding:0;outline:none;color:var(--text)}
.stp input::placeholder{color:var(--faint);font-weight:400;font-size:18px}
.stp:has(input:focus){box-shadow:0 0 0 2px var(--accent) inset}
.set-foot{display:grid;grid-template-columns:1fr auto;align-items:end;gap:8px;margin-top:10px}
.rir-l{display:block;font-size:13px;color:var(--muted);margin:0 0 4px 2px}
.rir-l em{font-style:normal;color:var(--faint)}
.chips{display:grid;grid-template-columns:repeat(5,1fr);gap:4px}
.chip{min-width:0;height:44px;border-radius:10px;background:var(--surface-2);font-size:16px;font-weight:600;color:var(--muted);font-variant-numeric:tabular-nums}
.chip[aria-pressed="true"]{background:var(--text);color:var(--bg)}
.btn-done{min-width:84px;height:48px;border-radius:12px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:16px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:6px;flex-shrink:0}
.btn-done.on{background:transparent;color:var(--accent);box-shadow:0 0 0 1.5px var(--accent-line) inset}
.set-done{width:100%;display:flex;align-items:center;gap:10px;min-height:48px;padding:8px 12px;border-radius:12px;background:var(--accent-soft);text-align:left;font-variant-numeric:tabular-nums}
.set-done .chk{color:var(--accent);display:grid}
.set-done .set-n{font-size:13px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);min-width:46px}
.set-done .set-sum{font-size:18px;font-weight:600;flex:1}
.set-done .set-rir{font-size:14px;color:var(--muted)}

.suggest{border-radius:12px;background:var(--warn-soft);color:var(--warn);padding:10px 14px;font-size:15px;line-height:1.35}
.suggest small{display:block;color:var(--muted);font-size:13px;margin-top:2px}
textarea{width:100%;min-height:52px;resize:vertical;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:10px 12px;font-size:16px;line-height:1.35;outline:none}
textarea:focus{border-color:var(--accent)}
.fld-label{display:block;font-size:13px;color:var(--muted);margin:0 0 4px 2px}
.lastnote{margin:4px 2px 0;font-size:14px;color:var(--faint)}
.row2{display:flex;gap:8px;flex-wrap:wrap}
.btn-primary{min-height:54px;border-radius:14px;background:var(--accent);color:var(--accent-ink);font-weight:700;font-size:17px;padding:0 18px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-secondary{min-height:52px;border-radius:14px;background:var(--surface-2);border:1px solid var(--line);font-weight:600;font-size:16px;padding:0 16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn-text{min-height:44px;padding:0 10px;font-weight:600;font-size:15px;color:var(--muted)}
.btn-text.danger{color:var(--danger)}
.btn-danger{min-height:52px;border-radius:14px;background:var(--danger-soft);color:var(--danger);border:1px solid var(--danger);font-weight:700;font-size:16px;padding:0 16px}
.block{width:100%}
.ro{margin:0;padding:12px 14px;border-radius:12px;background:var(--surface-2);font-size:15px;color:var(--muted)}

/* cardio */
.guide{margin:0;font-size:15.5px;line-height:1.4}
.guide b{color:var(--accent);font-weight:600}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.fld input{width:100%;height:54px;border-radius:12px;border:0;background:var(--surface-2);text-align:center;font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;outline:none}
.fld input:focus{box-shadow:0 0 0 2px var(--accent) inset}
.fld input::placeholder{color:var(--faint);font-weight:400;font-size:16px}
.fld .fld-label em{font-style:normal;color:var(--faint)}
.fields4{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.ivl{border-radius:12px;background:var(--surface-2);padding:12px 14px;display:flex;flex-direction:column;gap:8px}
.ivl-row{display:flex;align-items:baseline;justify-content:space-between;gap:10px}
.ivl-label{font-size:15px;font-weight:700;letter-spacing:.04em}
.ivl-label.hard{color:var(--accent)}
.ivl-time{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.ivl-sub{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}

/* session footer */
.session{margin-top:16px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.session h2{font-size:17px;margin:0}
.date-in{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:16px;width:100%}
.hint{font-size:14px;color:var(--faint);text-align:center;margin:18px 0 0}

/* bottom bar */
.bottombar{position:fixed;left:0;right:0;bottom:0;z-index:40;background:var(--bg);border-top:1px solid var(--line);padding:10px 0 calc(10px + env(safe-area-inset-bottom))}
.bar-in{display:flex;align-items:center;gap:8px;min-height:56px}
.bar-undo{width:52px;height:54px;border-radius:12px;background:var(--surface);border:1px solid var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;font-size:11px;font-weight:600;color:var(--muted);flex-shrink:0}
.rest-l{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint);flex-shrink:0;width:34px;text-align:center}
.rest-chips{flex:1;display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.rest-chip{height:54px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-size:16px;font-weight:600;font-variant-numeric:tabular-nums}
.rest-chip[aria-pressed="true"]{border-color:var(--accent-line)}
.rest-run{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:center;gap:6px;padding:0 4px}
.rest-top{display:flex;align-items:baseline;gap:8px}
.rest-top .k{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--faint)}
.rest-time{font-size:34px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1}
.rest-track{height:5px;border-radius:5px;background:var(--surface-2);overflow:hidden}
.rest-track i{display:block;height:100%;background:var(--accent);width:0}
.rest-btn{height:54px;min-width:54px;border-radius:12px;background:var(--surface);border:1px solid var(--line);font-weight:600;font-size:16px;padding:0 10px;flex-shrink:0}
.rest-done{flex:1;height:54px;border-radius:12px;background:var(--accent);color:var(--accent-ink);display:flex;align-items:center;justify-content:center;font-weight:700;font-size:18px}

/* toast */
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(92px + env(safe-area-inset-bottom));z-index:60;width:min(528px,calc(100% - 32px));background:var(--text);color:var(--bg);border-radius:12px;padding:6px 6px 6px 14px;display:flex;align-items:center;justify-content:space-between;gap:10px;font-size:15px;font-weight:500;min-height:48px;box-shadow:0 6px 24px rgba(0,0,0,.35)}
.toast button{min-height:40px;padding:0 14px;border-radius:9px;font-weight:700;color:var(--bg);background:transparent;box-shadow:0 0 0 1.5px currentColor inset}

/* history */
.hist h1{font-size:24px;margin:18px 0 12px}
.hist-list{display:flex;flex-direction:column;gap:8px;margin-top:12px}
.hrow{width:100%;display:flex;align-items:center;justify-content:space-between;gap:12px;text-align:left;padding:14px;border-radius:14px;background:var(--surface);border:1px solid var(--line);min-height:64px}
.hrow b{font-weight:600}
.hrow small{display:block;font-size:14px;color:var(--muted)}
.hrow-side{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap;font-weight:600}
.empty{padding:22px 14px;border-radius:14px;border:1px dashed var(--line);color:var(--muted);font-size:15px;text-align:center;margin-top:12px}
details.exh{background:var(--surface);border:1px solid var(--line);border-radius:14px}
details.exh summary{list-style:none;padding:14px;min-height:56px;cursor:pointer;display:flex;flex-direction:column;gap:2px}
details.exh summary::-webkit-details-marker{display:none}
details.exh summary b{font-size:15px;letter-spacing:.06em;text-transform:uppercase}
details.exh summary small{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
details.exh[open] summary{border-bottom:1px solid var(--line)}
.lines{list-style:none;margin:0;padding:6px 14px 12px}
.lines li{padding:8px 0;border-bottom:1px solid var(--line);font-variant-numeric:tabular-nums}
.lines li:last-child{border-bottom:0}
.lines .d{display:block;font-size:13px;color:var(--faint);font-weight:600}
.lines .v{display:block;font-size:17px;font-weight:600}
.lines .r{display:block;font-size:13px;color:var(--muted)}
.panel{margin-top:22px;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px;display:flex;flex-direction:column;gap:12px}
.panel h2{font-size:17px;margin:0}
.panel p{margin:0;font-size:14.5px;color:var(--muted)}
.btn-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:48px}
.setrow span small{display:block;font-size:13px;color:var(--faint)}
.switch{width:58px;height:46px;position:relative;flex-shrink:0}
.switch::before{content:"";position:absolute;left:3px;right:3px;top:7px;height:32px;border-radius:999px;background:var(--surface-2);border:1px solid var(--line);box-sizing:border-box}
.switch::after{content:"";position:absolute;top:11px;left:7px;width:24px;height:24px;border-radius:50%;background:var(--faint);transition:transform .15s}
.switch[aria-checked="true"]::before{background:var(--accent);border-color:var(--accent)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--accent-ink)}
.setrow .date-in{width:auto;min-width:150px}

/* modal sheet */
.modal{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.6);display:flex;align-items:flex-end;justify-content:center}
.sheet{width:100%;max-width:560px;max-height:88vh;overflow:auto;background:var(--surface);border-radius:20px 20px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));border-top:1px solid var(--line);-webkit-overflow-scrolling:touch}
.sheet h2{font-size:20px;margin:0 0 4px}
.sheet .sub{margin:0 0 12px;color:var(--muted);font-size:15px}
.sheet-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.sheet .actions{display:flex;flex-direction:column;gap:8px;margin-top:16px}
.sheet .confirm-in{width:100%;height:50px;border-radius:12px;border:1px solid var(--line);background:var(--surface-2);padding:0 12px;font-size:18px;margin-top:10px;text-transform:uppercase;letter-spacing:.1em}
.sd-ex{padding:10px 0;border-bottom:1px solid var(--line)}
.sd-ex:last-of-type{border-bottom:0}
.sd-ex b{font-weight:600}
.sd-ex .v{font-size:17px;font-weight:600;font-variant-numeric:tabular-nums}
.sd-ex .r,.sd-ex .n{font-size:14px;color:var(--muted)}
.sd-notes{margin-top:12px;padding:12px;border-radius:12px;background:var(--surface-2);font-size:15px;white-space:pre-wrap}
.storage-warn{margin:12px 0 0;padding:12px 14px;border-radius:12px;background:var(--danger-soft);color:var(--danger);font-size:15px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
@media (min-width:600px){.toast{bottom:calc(100px + env(safe-area-inset-bottom))}}
</style>
</head>

let modalResolve = null;

      ${prev && !it.priming && rangeDone(it, prev.entry.sets) ? `<div class="pb-hint">${it.kind === 'hold' ? `Last session hit the top of the range — ${esc(M.next)} today.` : `Last session completed the range — ${M.assist ? 'slightly less assistance' : 'a small weight increase'} may fit today.`}</div>` : ''}
      ${ctx.week <= 2 ? (it.kind === 'hold' ? '<p class="early">Learn the positions: start with the easier version and the low end of each range.</p>' : '<p class="early">Establish clean starting loads. Finish most sets with approximately 2–3 reps in reserve.</p>') : ''}

function stepper(slot, i, f, label, val, ph, step, int){

  </div></div>`;
}
function prevWeightFor(prev, i){ if (!prev) return null; const ps = prev.entry.sets; return (ps[i] && ps[i].weight != null) ? ps[i].weight : (ps.find(x => x && x.weight != null) || {}).weight ?? null; }
function renderSet(it, M, s, i, prev, isCur){

    const planned = s.weight != null || s[k] != null;
    return `<button class="set-up" data-act="openset" data-slot="${slot}" data-i="${i}" aria-label="Set ${i + 1}, tap to log">
      <span class="set-n">Set ${i + 1}</span><span class="set-sum">${planned ? esc([s.weight != null ? wText(M, s.weight) : '', s[k] != null ? fmtNum(s[k]) + unitSuffix(it) : ''].filter(Boolean).join(' × ')) : 'Up next'}</span><span class="set-tgt">${esc(it.min === it.max ? String(it.max) : it.min + '–' + it.max)}${unitSuffix(it)}</span></button>`;
  }

        <button class="btn-done ${s.done ? 'on' : ''}" data-act="${s.done ? 'uncomplete' : 'complete'}" data-slot="${slot}" data-i="${i}" aria-label="${s.done ? 'Mark set ' + (i + 1) + ' not done' : 'Complete set ' + (i + 1)}">${s.done ? ICON.check + ' Done' : 'Done'}</button>
      </div>
    </div>`;
  }

  const rir = it.kind === 'timed' ? '<span></span>' :
    `<div><span class="rir-l">RIR <em>optional</em></span><div class="chips">${[0, 1, 2, 3, 4].map(v => `<button class="chip" data-act="rir" data-slot="${slot}" data-i="${i}" data-v="${v}" aria-pressed="${s.rir === v}" aria-label="Reps in reserve ${v === 4 ? '4 or more' : v}, set ${i + 1}">${v === 4 ? '4+' : v}</button>`).join('')}</div></div>`;
  return `<div class="set ${s.done ? 'is-done' : ''} ${isCur ? 'current' : ''}">
    <div class="set-title"><span>Set ${i + 1}${it.kind === 'perleg' ? ' <small>· per leg</small>' : ''}</span>${s.done ? `<button class="btn-text set-close" data-act="closeset" data-slot="${slot}">Close</button>` : ''}</div>
    <div class="steppers">
      ${stepper(slot, i, 'weight', wLabel(M), s.weight, pw != null ? fmtNum(pw) : 'lb', 5, false)}
      ${stepper(slot, i, k, repsLabel, s[k], range, k === 'seconds' ? 5 : 1, true)}
    </div>
    <div class="set-foot">${rir}
      <button class="btn-done ${s.done ? 'on' : ''}" data-act="${s.done ? 'uncomplete' : 'complete'}" data-slot="${slot}" data-i="${i}" aria-label="${s.done ? 'Mark set ' + (i + 1) + ' not done' : 'Complete set ' + (i + 1)}">${s.done ? ICON.check + ' Done' : 'Done'}</button>
    </div>
  </div>`;
}
function suggestion(it, M, sets){
  if (it.priming || !rangeDone(it, sets)) return '';
  if (it.kind === 'hold') return `<div class="suggest" role="status">Range completed — next time, ${esc(M.next)}.<small>Only if the position stayed clean. Nothing changes automatically.</small></div>`;
  return `<div class="suggest" role="status">Range completed — consider ${M.assist ? 'slightly less assistance' : 'a small weight increase'} next session.<small>Only if every rep was clean. This is a suggestion; nothing changes automatically.</small></div>`;
}

function renderFlowCard(it, ctx){
  const P = FLOW_PARTS[it.part], V = FLOW_VIDEOS[P.vid], slot = it.slot;
  const e = ctx.session ? ctx.session.entries[slot] : null; const done = !!(e && e.done);
  const open = S.ui.open[ctx.day.id] === slot; const isNext = ctx.next === slot;
  const prev = findPrevFlow(it.part, ctx.before);
  const cls = ['card', open && 'open', done && 'done', isNext && 'next'].filter(Boolean).join(' ');
  let h = `<section class="${cls}" id="card-${slot}">

function ivlState(now){

  S.active = newSession(dayId);
  if (!S.settings.programStart){ S.settings.programStart = S.active.date; saveSettings(); }
  DAY_BY_ID[dayId].items.forEach(it => { delete S.ui.previewMove[it.slot]; });
  S.ui.justSaved = null; saveActive(); saveUI();
  try { if (navigator.storage && navigator.storage.persist) navigator.storage.persist().catch(() => {}); } catch(e){}
  renderHeader(); renderBar(); syncWakeLock();
  toast((isHome(dayId) ? 'Session' : 'Workout') + ' started — timer running');
  return true;
}
function startWorkout(dayId){
  if (S.active && S.active.dayId !== dayId){

      .then(v => { if (v){ S.ui.dayId = S.active.dayId; S.ui.view = 'day'; saveUI(); renderAll(); } });

}

  if (!open) scrollToCard(slot);
}
function entryFor(slot){ const it = ITEM_BY_SLOT[slot]; if (!ensureActive(it.dayId)) return null; return S.active.entries[slot]; }
function setVariant(slot, move){
  const it = ITEM_BY_SLOT[slot];
  if (S.active && S.active.dayId === it.dayId){ pushUndo('Change variation'); S.active.entries[slot].move = move; saveActive(); }
  else { S.ui.previewMove[slot] = move; saveUI(); }

}
function baseFor(it, e, i, f, dir){
  if (f === 'weight'){
    for (let k = i - 1; k >= 0; k--) if (e.sets[k].weight != null) return e.sets[k].weight;
    const pw = prevWeightFor(findPrev(e.move, currentKey()), i); return pw != null ? pw : 0;
  }
  return dir > 0 ? it.min : it.max;
}
function stepField(slot, i, f, d){
  const it = ITEM_BY_SLOT[slot]; const e = entryFor(slot); if (!e) return;
  pushUndo('Adjust ' + (f === 'weight' ? 'weight' : f), { coalesce:`${slot}:${i}:${f}` });
  const s = e.sets[i]; let v = s[f] == null ? baseFor(it, e, i, f, d) : s[f] + d;
  v = Math.max(0, Math.round(v * 100) / 100); s[f] = v; saveActive();
  const inp = document.getElementById(`in-${slot}-${i}-${f}`); if (inp) inp.value = fmtNum(v);
  updateLive(slot);
}

  if (s[k] == null){ toast(`Enter ${k === 'seconds' ? 'seconds' : 'reps'} for set ${i + 1} first`); const inp = document.getElementById(`in-${slot}-${i}-${k}`); if (inp) inp.focus(); return; }

  s.done = true; s.at = Date.now(); S.tmp.openSet = null;
  const nx = e.sets[i + 1]; if (nx && !nx.done && nx.weight == null && s.weight != null) nx.weight = s.weight;

  let jump = null;

}
function uncompleteSet(slot, i){ const e = entryFor(slot); if (!e) return; pushUndo(`Reopen set ${i + 1}`); e.sets[i].done = false; e.done = false; S.tmp.openSet = null; saveActive(); renderAll(); }
function completeExercise(slot){

}
function reopenExercise(slot){ const e = entryFor(slot); if (!e) return; pushUndo('Reopen exercise'); e.done = false; saveActive(); renderAll(); }
function goNext(slot){ if (!slot) return; S.ui.open[S.ui.dayId] = slot; S.tmp.openSet = null; saveUI(); renderDay(); scrollToCard(slot); }

  const e = entryFor(slot); if (!e) return; const prev = findPrev(e.move, currentKey()); if (!prev) return;
  pushUndo('Copy previous weight'); let n = 0;
  e.sets.forEach((s, i) => { if (!s.done){ const w = prevWeightFor(prev, i); if (w != null){ s.weight = w; n++; } } });

}
function cardioEntry(){ const day = DAY_BY_ID[S.ui.dayId]; if (!ensureActive(day.id)) return null; return S.active.cardio; }
function setCardioChoice(key, val){ const c = cardioEntry(); if (!c) return; pushUndo('Cardio ' + key); c[key] = val; saveActive(); renderDay(); }
function completeCardio(){ const c = cardioEntry(); if (!c) return; pushUndo('Complete cardio'); c.done = true; saveActive(); const nx = nextSlot(S.active); if (nx){ S.ui.open[S.ui.dayId] = nx; saveUI(); } renderAll(); if (nx) scrollToCard(nx); }

let lastIvlKey = null;
function ivlStart(){ const c = cardioEntry(); if (!c) return; pushUndo('Start 4×4 timer'); S.active.ivl = { startedAt:Date.now() }; lastIvlKey = '0h'; saveActive(); chime('go'); renderDay(); }

/* ---------- hold timer (hands-free: 5 s get-set, beep at range min, double beep at max) ---------- */
let HOLD = null;
function holdStart(slot, i){
  const it = ITEM_BY_SLOT[slot]; const e = entryFor(slot); if (!e) return;
  S.rest = null; saveRest(); unlockAudio();
  const now = Date.now(); HOLD = { slot, i, start:now + 5000, min:it.min, max:it.max, lastLead:6, cued:{} };
  renderBar(); syncWakeLock();
}
function holdStop(cancel){
  if (!HOLD) return; const h = HOLD; HOLD = null; const now = Date.now();
  if (cancel || now < h.start){ renderBar(); toast('Hold cancelled'); return; }
  const e = S.active && S.active.entries[h.slot]; if (!e){ renderBar(); return; }
  pushUndo(`Hold set ${h.i + 1}`);
  e.sets[h.i].seconds = Math.max(1, Math.round((now - h.start) / 1000)); saveActive();
  completeSet(h.slot, h.i, { noUndo:true });
  toast(`Set ${h.i + 1}: ${e.sets[h.i].seconds} s logged`, { undo:true });
}
function holdTick(now){
  const t = $('#holdTime'), k = $('#holdK'), sub = $('#holdSub'); const h = HOLD;
  if (now < h.start){
    const lead = Math.ceil((h.start - now) / 1000);
    if (lead !== h.lastLead){ h.lastLead = lead; if (lead <= 3) chime('tick'); }
    if (k) k.textContent = 'Get set'; if (t) t.textContent = String(lead); return;
  }
  const el = (now - h.start) / 1000;
  if (!h.cued.go){ h.cued.go = true; chime('go'); }
  if (el >= h.min && !h.cued.min && h.min !== h.max){ h.cued.min = true; chime('min'); }
  if (el >= h.max && !h.cued.max){ h.cued.max = true; chime('rest'); }
  if (k) k.textContent = 'Hold'; if (t) t.textContent = Math.floor(el) + ' s';
  if (sub){ const inRange = el >= h.min; sub.className = 'hold-sub' + (inRange ? ' in' : ''); sub.textContent = el >= h.max ? 'Top of range — stop when ready' : inRange ? 'In range ✓' : `${itemName(h.slot)} · target ${h.min === h.max ? h.max : h.min + '–' + h.max} s`; }
}

/* ---------- flows ---------- */

function addRest(sec){ if (!S.rest || S.rest.doneAt) return; S.rest.endsAt += sec * 1000; S.rest.total += sec; saveRest(); renderBar(); }

/* ---------- finish / discard / edit ---------- */
async function finishWorkout(){

    body: editing ? 'The original date and duration are kept.' : `${p.done} of ${p.total} complete · ${fmtDur((Date.now() - a.startedAt) / 1000)}${p.done < p.total ? '<br>Unfinished items are saved exactly as logged.' : ''}`,

/* ---------- export / import / reset ---------- */
function buildExport(){ return { app:APP_ID, schema:SCHEMA, exportedAt:new Date().toISOString(), settings:S.settings, sessions:S.history, active:S.active }; }
function backupFile(){ const json = JSON.stringify(buildExport(), null, 2); return { json, name:`gym-companion-backup-${isoDate()}.json` }; }
function canShareFiles(){ try { return !!(navigator.canShare && navigator.share && navigator.canShare({ files:[new File(['{}'], 'x.json', { type:'application/json' })] })); } catch(e){ return false; } }
function markExported(){ S.settings.lastExport = isoDate(); saveSettings(); if (S.ui.view === 'history') renderHistory(); }
function exportData(){
  const { json, name } = backupFile(); const url = URL.createObjectURL(new Blob([json], { type:'application/json' }));
  const a = document.createElement('a'); a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 5000); markExported(); toast(`Backup exported (${S.history.length} workouts)`);
}
async function shareData(){
  const { json, name } = backupFile();
  try { await navigator.share({ files:[new File([json], name, { type:'application/json' })], title:'Gym Companion backup' }); markExported(); }
  catch(e){ if (e && e.name !== 'AbortError') toast('Sharing failed — use Export JSON instead'); }
}
function validSession(s){ return s && typeof s === 'object' && typeof s.id === 'string' && DAY_BY_ID[s.dayId] && s.entries && typeof s.entries === 'object' && typeof s.date === 'string' && /^\d{4}-\d{2}-\d{2}$/.test(s.date); }
function parseBackup(data){
  const list = Array.isArray(data) ? data : data && (data.sessions || data.history);
  if (!Array.isArray(list)) throw new Error('This file is not a Gym Companion backup.');
  const valid = list.filter(validSession).map(s => normalizeSession(JSON.parse(JSON.stringify(s))));
  return { valid, skipped:list.length - valid.length, settings:data && !Array.isArray(data) ? data.settings : null, active:data && !Array.isArray(data) && validSession(data.active) ? data.active : null };
}
function applyImport(parsed, mode){
  pushUndo('Import', { history:true });
  if (mode === 'replace'){
    S.history = parsed.valid;
    if (parsed.settings && typeof parsed.settings === 'object') S.settings = Object.assign({}, DEFAULT_SETTINGS, parsed.settings);
    if (!S.active && parsed.active) S.active = normalizeSession(parsed.active);
  } else {
    const have = new Set(S.history.map(s => s.id)); S.history = S.history.concat(parsed.valid.filter(s => !have.has(s.id)));
    if (!S.settings.programStart && parsed.settings && parsed.settings.programStart) S.settings.programStart = parsed.settings.programStart;
  }
  saveHistory(); saveSettings(); saveActive(); renderAll();
}
async function importFromText(text){
  let parsed;
  try { parsed = parseBackup(JSON.parse(text)); }
  catch(e){ await dialog({ title:'Import failed', body:esc(e instanceof SyntaxError ? 'That file is not valid JSON.' : e.message), actions:[{ label:'OK', kind:'primary' }] }); return; }
  const have = new Set(S.history.map(s => s.id)); const fresh = parsed.valid.filter(s => !have.has(s.id)).length;
  const choice = await dialog({ title:'Import backup', body:`${parsed.valid.length} workout${parsed.valid.length === 1 ? '' : 's'} in file · ${fresh} not on this device yet${parsed.skipped ? ` · ${parsed.skipped} unreadable skipped` : ''}.<br><b>Add new</b> keeps everything here and adds the missing ones. <b>Replace</b> makes this device match the file.`,
    actions:[{ label:`Add ${fresh} new`, value:'merge', kind:'primary' }, { label:'Replace everything with file', value:'replace', kind:'danger' }, { label:'Cancel' }] });
  if (!choice) return;
  applyImport(parsed, choice);
  toast(choice === 'replace' ? `Replaced with ${parsed.valid.length} workouts from file` : `Added ${fresh} workout${fresh === 1 ? '' : 's'}`, { undo:true });
}
$('#importFile').addEventListener('change', async e => { const f = e.target.files && e.target.files[0]; e.target.value = ''; if (f) importFromText(await f.text()); });
async function resetData(){
  const ok = await dialog({ title:'Reset all data?', body:'This permanently deletes every workout, the active session and all settings on this device. Export a backup first if you might want it. Type RESET to confirm.', confirmWord:'RESET',
    actions:[{ label:'Delete everything', value:true, kind:'danger', needsWord:true }, { label:'Cancel' }] });
  if (!ok) return;
  Object.values(LS).forEach(k => { try { localStorage.removeItem(k); } catch(e){} });
  S.history = []; S.active = null; S.rest = null; S.settings = Object.assign({}, DEFAULT_SETTINGS); S.ui = defaultUI(); S.ui.dayId = defaultDay(); S._sorted = null;
  undoStack.length = 0; lastIvlKey = null; syncWakeLock(); renderAll(); toast('All data reset');
}

/* =====================================================================
   EVENTS
   ===================================================================== */
document.addEventListener('click', ev => {
  const el = ev.target.closest('[data-act]'); if (!el || el.disabled) return;
  const d = el.dataset, slot = d.slot, i = d.i != null ? +d.i : null;
  switch (d.act){
    case 'view-day': S.ui.view = 'day'; S.ui.dayId = d.day; S.ui.lastDay[DAY_BY_ID[d.day].group] = d.day; S.tmp.openSet = null; saveUI(); closeSheet(); renderAll(); window.scrollTo(0, 0); break;
    case 'mode': setMode(d.mode); break;
    case 'flow-done': flowDone(slot); break;
    case 'flow-undone': flowUndone(slot); break;
    case 'flow-rounds': flowRounds(slot, +d.v); break;
    case 'hold-start': holdStart(slot, i); break;
    case 'hold-stop': holdStop(false); break;
    case 'hold-cancel': holdStop(true); break;
    case 'view-history': S.ui.view = S.ui.view === 'history' ? 'day' : 'history'; saveUI(); renderAll(); window.scrollTo(0, 0); break;
    case 'toggle': toggleCard(slot); break;

    case 'copyprev': copyPrev(slot); break;
    case 'exdone': completeExercise(slot); break;
    case 'exundone': reopenExercise(slot); break;
    case 'gonext': goNext(slot); break;
    case 'cues': S.ui.cues = S.ui.cues || {}; S.ui.cues[d.move] = d.open !== '1'; saveUI(); renderDay(); break;
    case 'start': startWorkout(S.ui.dayId); break;
    case 'finish': finishWorkout(); break;
    case 'discard': discardWorkout(); break;
    case 'rest': startRest(+d.s); break;
    case 'rest-add': addRest(15); break;
    case 'rest-stop': stopRest(); break;
    case 'undo': undo(); break;
    case 'cchoice': setCardioChoice(d.cf, d.v); break;
    case 'cdone': completeCardio(); break;
    case 'cundone': reopenCardio(); break;
    case 'ivl-start': ivlStart(); break;
    case 'ivl-stop': ivlStop(); break;
    case 'hist-tab': S.ui.histTab = d.tab; saveUI(); renderHistory(); break;
    case 'session': openSession(d.id); break;
    case 'exhist': openExerciseHistory(d.move); break;
    case 'edit-session': editSession(d.id); break;
    case 'delete-session': deleteSession(d.id); break;
    case 'close-modal': closeSheet(); break;
    case 'dismiss-saved': S.ui.justSaved = null; saveUI(); renderDay(); break;
    case 'export': exportData(); break;
    case 'share': shareData(); break;
    case 'import': $('#importFile').click(); break;
    case 'reset': resetData(); break;
    case 'setting': S.settings[d.key] = !S.settings[d.key]; saveSettings(); syncWakeLock(); renderHistory(); break;
    case 'theme': S.settings.theme = d.v; saveSettings(); renderAll(); break;
  }
});
document.addEventListener('focusin', e => { const el = e.target; if (el.matches && el.matches('input[data-f],input[data-cf],textarea[data-nf],textarea[data-cnote],textarea[data-sf]')) pendingSnap = snapshot(false); });
document.addEventListener('focusout', () => { pendingSnap = null; });
function commitPending(label){ if (pendingSnap){ pushUndo(label, { snap:pendingSnap }); pendingSnap = null; } }
document.addEventListener('input', e => {
  const el = e.target, d = el.dataset;
  if (d.f){
    const it = ITEM_BY_SLOT[d.slot]; if (!it) return;
    const snap = pendingSnap; if (!S.active && !snap) pendingSnap = snapshot(false);
    if (!ensureActive(it.dayId)) return; commitPending('Edit set ' + (+d.i + 1));
    S.active.entries[d.slot].sets[+d.i][d.f] = parseNum(el.value, d.f !== 'weight'); saveActive(); updateLive(d.slot);
  } else if (d.nf){
    const it = ITEM_BY_SLOT[d.nf]; if (!S.active && !pendingSnap) pendingSnap = snapshot(false);

  } else if (d.cf || d.cnote){
    if (!S.active && !pendingSnap) pendingSnap = snapshot(false);

    if (d.cnote) c.notes = el.value;
    else if (d.cf === 'hr'){ c.hr = Array.isArray(c.hr) ? c.hr : [null, null, null, null]; c.hr[+d.i] = parseNum(el.value, true); }
    else c[d.cf] = parseNum(el.value, d.cf === 'avgHr');

});
document.addEventListener('change', e => {
  const el = e.target, d = el.dataset;
  if (d.sf === 'date' && S.active && /^\d{4}-\d{2}-\d{2}$/.test(el.value)){ pushUndo('Change date'); S.active.date = el.value; saveActive(); renderHeader(); }
  if (d.setting === 'programStart'){ S.settings.programStart = /^\d{4}-\d{2}-\d{2}$/.test(el.value) ? el.value : null; saveSettings(); renderAll(); }
});

/* =====================================================================
   TICK (timers)
   ===================================================================== */
function tick(){
  const now = Date.now(), a = S.active;
  if (HOLD) holdTick(now);
  if (a && !a.editing){ const t = $('#hdrTimer'); if (t) t.textContent = fmtClock((now - a.startedAt) / 1000); }
  if (S.rest){
    if (!S.rest.doneAt){
      const left = (S.rest.endsAt - now) / 1000;
      if (left <= 0){ const fresh = now - S.rest.endsAt < 5000; S.rest.doneAt = now; saveRest(); if (fresh) chime('rest'); renderBar(); }
      else { const t = $('#restTime'); if (t) t.textContent = fmtClock(Math.ceil(left)); const f = $('#restFill'); if (f) f.style.width = Math.min(100, (1 - left / S.rest.total) * 100) + '%'; }
    } else if (now - S.rest.doneAt > 10000){ S.rest = null; saveRest(); renderBar(); }
  }
  if (a && a.ivl){
    const st = ivlState(now);
    if (st.key !== lastIvlKey){
      const wasRunning = lastIvlKey !== null; lastIvlKey = st.key;
      if (wasRunning && st.since < 5) chime(st.finished ? 'rest' : st.hard ? 'go' : 'easy');
      if (st.finished && a.cardio.duration == null){ a.cardio.duration = Math.round(st.total / 60); saveActive(); }
      const box = $('#ivl'); if (box) box.innerHTML = ivlInner();
    } else if (!st.finished){
      const t = $('#ivlTime'); if (t) t.textContent = fmtClock(Math.ceil(st.left));
      const s = $('#ivlSub'); if (s) s.textContent = `Total ${fmtClock(st.el)} / 28:00`;
    }
  }
}

/* =====================================================================
   INIT
   ===================================================================== */
function defaultDay(){ return todayDay(); }
function init(){
  if (S.active && !DAY_BY_ID[S.active.dayId]) S.active = null;
  if (!S.ui.lastDay || typeof S.ui.lastDay !== 'object') S.ui.lastDay = {};
  if (S.active) normalizeSession(S.active);
  if (S.rest && (typeof S.rest.endsAt !== 'number' || Date.now() - S.rest.endsAt > 60000)) S.rest = null;
  if (S.active && S.active.ivl){ const st = ivlState(Date.now()); lastIvlKey = st ? st.key : null; }
  if (S.active){ S.ui.dayId = S.active.dayId; S.ui.view = 'day'; }
  else { S.ui.dayId = defaultDay(); if (S.ui.view !== 'history') S.ui.view = 'day'; }
  saveUI(); renderAll();
